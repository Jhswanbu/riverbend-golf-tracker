const describe = (players) => `Best ${players.map(p => p + 1).join(' & ')} ball${players.length > 1 ? 's' : ''}`;

// Default split: e.g. 4 per team, 2 bets -> bet 1 = balls 1&2, bet 2 = balls 3&4
function generateBetConfiguration(numBets, N) {
  N = Math.max(1, N);
  numBets = Math.max(1, Math.min(numBets, N));
  const per = Math.max(1, Math.floor(N / numBets));
  const config = [];
  for (let i = 0; i < numBets; i++) {
    const players = [];
    for (let j = i * per; j < (i + 1) * per && j < N; j++) players.push(j);
    config.push({ betNumber: i + 1, players, description: describe(players) });
  }
  return config;
}

// Keep a manual configuration valid when team sizes change
function sanitizeConfig(config, N, numBets) {
  const cfg = (config || []).map(b => ({ players: (b.players || []).filter(p => p < N) })).filter(b => b.players.length);
  if (!cfg.length) return generateBetConfiguration(numBets, N);
  return cfg.map((b, i) => ({ betNumber: i + 1, players: b.players, description: describe(b.players) }));
}

/* ---------- tee-time groups ---------- */
const MAX_GROUP = 5;
const fmtTime = (t) => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`; };
const groupLabel = (g, i) => g.time ? fmtTime(g.time) : `Tee ${i + 1}`;

// Evenly split players into the fewest groups of <= 5, mixing both teams in each group
function autoGroups(team1, team2, prev = []) {
  const order = [];
  const m = Math.max(team1.length, team2.length);
  for (let i = 0; i < m; i++) { if (team1[i]) order.push(team1[i].id); if (team2[i]) order.push(team2[i].id); }
  const n = order.length;
  const g = Math.max(1, Math.ceil(n / MAX_GROUP));
  const base = Math.floor(n / g), extra = n % g;
  let idx = 0;
  return Array.from({ length: g }, (_, k) => {
    const size = base + (k < extra ? 1 : 0);
    const ids = order.slice(idx, idx + size); idx += size;
    return { id: k + 1, time: prev[k]?.time || '', playerIds: ids };
  });
}

  );
}

function Stepper({ label, value, onChange, min = 1, max = 99, step = 1, prefix = '' }) {
  return (
    <div>
      <div className="text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">{label}</div>
      <div className="flex items-center justify-between bg-gray-50 rounded-xl border border-gray-200 p-1">
        <button className="btn w-10 h-10 rounded-lg bg-white shadow text-xl font-bold text-fairway-700" onClick={() => onChange(Math.max(min, +(value - step).toFixed(2)))}>−</button>
        <div className="text-xl font-bold text-gray-800">{prefix}{value}</div>
        <button className="btn w-10 h-10 rounded-lg bg-white shadow text-xl font-bold text-fairway-700" onClick={() => onChange(Math.min(max, +(value + step).toFixed(2)))}>+</button>
      </div>
    </div>
  );
}

function Toggle({ checked, onChange, title, sub }) {
  return (
    <label className="flex items-center justify-between gap-3 py-3 cursor-pointer">
      <div>
        <div className="font-medium text-gray-800">{title}</div>
        {sub && <div className="text-xs text-gray-500">{sub}</div>}
      </div>
      <button type="button" role="switch" aria-checked={checked} onClick={() => onChange(!checked)}
        className={`relative w-12 h-7 rounded-full shrink-0 transition ${checked ? 'bg-fairway-600' : 'bg-gray-300'}`}>
        <span className={`absolute top-0.5 left-0.5 w-6 h-6 bg-white rounded-full shadow transition-transform ${checked ? 'translate-x-5' : ''}`} />
      </button>
    </label>
  );
}

function PlayerRow({ player, selected, onToggle, onRename, onDelete, onGhin }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(player.name);
  const [ghinDraft, setGhinDraft] = useState(player.ghinNumber || '');
  const [idxDraft, setIdxDraft] = useState(player.handicapIndex == null ? '' : String(player.handicapIndex));
  const commit = () => { const n = draft.trim(); if (n && n !== player.name) onRename(n); else setDraft(player.name); if (onGhin) { const ix = idxDraft.trim() === '' ? null : parseFloat(idxDraft); onGhin(ghinDraft.trim(), (ix === null || isNaN(ix)) ? null : ix); } setEditing(false); };
  return (
    <div className={`flex items-center gap-3 p-3 rounded-xl border-2 transition ${selected ? 'border-fairway-600 bg-fairway-50' : 'border-transparent bg-gray-50'}`}>
      <button onClick={onToggle} className={`btn w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold shrink-0 ${selected ? 'bg-fairway-600 text-white' : 'bg-white text-gray-500 border border-gray-200'}`}>
        {selected ? '✓' : initials(player.name)}
      </button>
      {editing ? (
        <div className="flex-1 min-w-0 space-y-1.5">
          <input autoFocus value={draft} onChange={e => setDraft(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { setDraft(player.name); setEditing(false); } }}
            className="w-full border rounded-lg px-2 py-1.5 font-medium" placeholder="Name" />
          <div className="flex gap-1.5">
            <input value={ghinDraft} onChange={e => setGhinDraft(e.target.value)} placeholder="GHIN #" inputMode="numeric"
              onKeyDown={e => { if (e.key === 'Enter') commit(); }}
              className="w-1/2 min-w-0 border rounded-lg px-2 py-1.5 text-sm" />
            <input value={idxDraft} onChange={e => setIdxDraft(e.target.value)} placeholder="Index (e.g. 12.4)" inputMode="decimal"
              onKeyDown={e => { if (e.key === 'Enter') commit(); }}
              className="w-1/2 min-w-0 border rounded-lg px-2 py-1.5 text-sm" />
          </div>
        </div>
      ) : (
        <>
          <button onClick={onToggle} className="flex-1 text-left font-medium text-gray-800 truncate">{player.name}</button>
          {player.handicapIndex != null && <span className="text-xs font-semibold text-gray-400 shrink-0">{Number(player.handicapIndex).toFixed(1)}</span>}
        </>
      )}
      <div className="flex gap-1 shrink-0">
        {editing ? <button onClick={commit} className="btn w-9 h-9 rounded-lg text-fairway-700 bg-fairway-50" title="Save">✓</button> : <button onClick={() => { setDraft(player.name); setGhinDraft(player.ghinNumber || ''); setIdxDraft(player.handicapIndex == null ? '' : String(player.handicapIndex)); setEditing(true); }} className="btn w-9 h-9 rounded-lg text-gray-400 hover:bg-white" title="Edit">✏️</button>}
        <button onClick={() => { if (confirm(`Remove ${player.name}? Their season stats will be lost.`)) onDelete(); }} className="btn w-9 h-9 rounded-lg text-gray-400 hover:bg-white" title="Remove">🗑️</button>
      </div>
    </div>
  );
}

function BreakdownTable({ data }) {
  if (!data) return null;
  const { rows, t1Bets, t2Bets, totalNet, team1Amt, team2Amt } = data;
  const amtCell = (v) => <td className={`p-2 text-right font-semibold whitespace-nowrap ${v > 0 ? 'text-fairway-700' : v < 0 ? 'text-red-600' : 'text-gray-400'}`}>{v === 0 ? '–' : money(v)}</td>;
  const netCell = (n) => <td className="p-2 text-center whitespace-nowrap">{n === 0 ? 'Even' : n > 0 ? `T1 +${n}` : `T2 +${-n}`}</td>;
  const win = totalNet > 0 ? 'Team 1' : totalNet < 0 ? 'Team 2' : null;
  return (
    <div>
      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="text-xs text-gray-500 uppercase">
            <tr><th className="p-2 text-left">Category</th><th className="p-2">T1 won</th><th className="p-2">T2 won</th><th className="p-2">Net</th><th className="p-2 text-right">T1 each</th><th className="p-2 text-right">T2 each</th></tr>
          </thead>
          <tbody className="divide-y">
            {rows.map((r, i) => (
              <tr key={i}>
                <td className="p-2 font-medium">{r.label}</td>
                <td className="p-2 text-center">{r.t1}</td><td className="p-2 text-center">{r.t2}</td>
                {netCell(r.net)}{amtCell(r.team1Amt)}{amtCell(r.team2Amt)}
              </tr>
            ))}
            <tr className="font-bold bg-gray-50">
              <td className="p-2">Total</td><td className="p-2 text-center">{t1Bets}</td><td className="p-2 text-center">{t2Bets}</td>
              {netCell(totalNet)}{amtCell(team1Amt)}{amtCell(team2Amt)}
            </tr>
          </tbody>
        </table>
      </div>
      <p className="text-xs text-gray-500 mt-2">
        {win ? `${win} wins by ${Math.abs(totalNet)} net bet${Math.abs(totalNet) > 1 ? 's' : ''}. ` : 'All square. '}
        Every player on a team wins or loses the same amount. "Each" is per player; a category's amount is its share of that total.
      </p>
    </div>
  );
}

/* ---------- main app ---------- */
function App() {
  const [view, setView] = useState('setup');
  const [entryMode, setEntryMode] = useState('hole');
  const [showSettings, setShowSettings] = useState(false);
  const [players, setPlayers] = useState(() => store.get('rb_players', defaultPlayers()));
  const [selected, setSelected] = useState(() => store.get('rb_selected', []));
  const [teams, setTeams] = useState(() => store.get('rb_teams', { team1: [], team2: [], hasOddPlayers: false, teamWithExtra: null }));
  const [settings, setSettings] = useState(() => store.get('rb_settings', { numBets: 1, betAmount: 5, betConfiguration: [], birdieBonus: false, parOrBetterBonus: false, allBalls: false, allBallsFront: 9, allBallsBack: 18 }));
  const [scores, setScores] = useState(() => store.get('rb_scores', {}));
  const [currentHole, setCurrentHole] = useState(() => store.get('rb_hole', 1));
  const [games, setGames] = useState(() => store.get('rb_games', []));
  const [groups, setGroups] = useState(() => store.get('rb_groups', []));
  const [activeGroup, setActiveGroup] = useState(0);
  const [newName, setNewName] = useState('');
  const [search, setSearch] = useState('');
  const [toast, setToast] = useState(null);
  const [session, setSession] = useState(null);
  const [authReady, setAuthReady] = useState(!sb);
  const [myRole, setMyRole] = useState(null);
  const [offline, setOffline] = useState(false);
  const [loginEmail, setLoginEmail] = useState('');
  const [loginPass, setLoginPass] = useState('');
  const [newPass, setNewPass] = useState('');
  const [scanBusy, setScanBusy] = useState(false);
  const [scanReview, setScanReview] = useState(null);
  const scanFileRef = useRef(null);
  const scanTargetsRef = useRef([]);
  const cloudReady = useRef(false);
  const applyingRemote = useRef(false);
  const liveSaveTimer = useRef(null);
  const playersSaveTimer = useRef(null);

  useEffect(() => store.set('rb_players', players), [players]);
  useEffect(() => store.set('rb_selected', selected), [selected]);
  useEffect(() => store.set('rb_teams', teams), [teams]);
  useEffect(() => store.set('rb_settings', settings), [settings]);
  useEffect(() => store.set('rb_scores', scores), [scores]);
  useEffect(() => store.set('rb_hole', currentHole), [currentHole]);
  useEffect(() => store.set('rb_games', games), [games]);
  useEffect(() => store.set('rb_groups', groups), [groups]);

  /* ----- supabase auth + cloud sync ----- */
  const canEdit = ['admin', 'scorekeeper'].includes(myRole);
  const signIn = async () => {
    if (!sb) return;
    const { error } = await sb.auth.signInWithPassword({ email: loginEmail.trim(), password: loginPass });
    if (error) flash(error.message);
  };
  const signInWithLink = async () => {
    if (!sb || !loginEmail.trim()) { flash('Enter your email first'); return; }
    const { error } = await sb.auth.signInWithOtp({ email: loginEmail.trim(), options: { emailRedirectTo: window.location.href } });
    flash(error ? error.message : 'Check your email for the sign-in link');
  };
  const updatePassword = async () => {
    if (!sb || !newPass) return;
    const { error } = await sb.auth.updateUser({ password: newPass });
    flash(error ? error.message : 'Password updated');
    if (!error) setNewPass('');
  };
  const signOut = async () => { if (sb) await sb.auth.signOut(); setSession(null); setOffline(false); };

  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => { setSession(data.session); setAuthReady(true); });
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => { setSession(s); setAuthReady(true); });
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!sb || !session) { setMyRole(null); cloudReady.current = false; return; }
    (async () => {
      const { data: prof } = await sb.from('profiles').select('role').eq('user_id', session.user.id).single();
      setMyRole(prof?.role || 'viewer');
      const [{ data: prows }, { data: grows }, { data: live }] = await Promise.all([
        sb.from('players').select('*').order('id'),
        sb.from('games').select('*').order('played_at', { ascending: false }),
        sb.from('live_round').select('state').eq('id', 1).single()
      ]);
      if (prows && prows.length) setPlayers(sortPlayers(prows.map(rowToPlayer)));
      if (grows) setGames(grows.map(gameRowToRecord));
      if (live && live.state && live.state.teams) {
        applyingRemote.current = true;
        setTeams(live.state.teams); setScores(live.state.scores || {});
        if (live.state.settings) setSettings(live.state.settings);
        setGroups(live.state.groups || []); setSelected(live.state.selected || []); setCurrentHole(live.state.currentHole || 1);
        setTimeout(() => { applyingRemote.current = false; }, 80);
      }
      cloudReady.current = true;
    })();
  }, [session]);

  useEffect(() => {
    if (!sb || !session) return;
    const ch = sb.channel('rb-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'live_round' }, (payload) => {
        const st = payload.new && payload.new.state;
        if (!st || !st.teams) return;
        if (payload.new.updated_by === session.user.id) return;
        applyingRemote.current = true;
        setTeams(st.teams); setScores(st.scores || {});
        if (st.settings) setSettings(st.settings);
        setGroups(st.groups || []); setSelected(st.selected || []); setCurrentHole(st.currentHole || 1);
        setTimeout(() => { applyingRemote.current = false; }, 80);
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'players' }, async () => {
        const { data } = await sb.from('players').select('*').order('id');
        if (data && data.length) setPlayers(sortPlayers(data.map(rowToPlayer)));
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'games' }, async () => {
        const { data } = await sb.from('games').select('*').order('played_at', { ascending: false });
        if (data) setGames(data.map(gameRowToRecord));
      })
      .subscribe();
    return () => { sb.removeChannel(ch); };
  }, [session]);

  // push the in-progress round to the cloud (debounced; editors only)
  useEffect(() => {
    if (!sb || !session || !canEdit || !cloudReady.current || applyingRemote.current) return;
    if (!teams.team1.length && !teams.team2.length) return;
    clearTimeout(liveSaveTimer.current);
    liveSaveTimer.current = setTimeout(async () => {
      const state = { teams, scores, settings, groups, selected, currentHole };
      await sb.from('live_round').update({ state, updated_by: session.user.id, updated_at: new Date().toISOString() }).eq('id', 1);
    }, 600);
  }, [teams, scores, settings, groups, selected, currentHole, session, myRole]);

  // keep the cloud roster/stats in step with local player edits (debounced; editors only)
  const playersJson = JSON.stringify(players);
  useEffect(() => {
    if (!sb || !session || !canEdit || !cloudReady.current) return;
    clearTimeout(playersSaveTimer.current);
    playersSaveTimer.current = setTimeout(async () => {
      await sb.from('players').upsert(players.map(playerToRow));
    }, 900);
  }, [playersJson, session, myRole]);

  const flash = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); };
  const hasTeams = teams.team1.length > 0 && teams.team2.length > 0;
  const sortPlayers = (list) => [...list].sort((a, b) => a.name.localeCompare(b.name));

  /* ----- tee-time groups ----- */
  const allTeamPlayers = [...teams.team1, ...teams.team2];
  useEffect(() => { if (hasTeams && groups.length === 0) setGroups(autoGroups(teams.team1, teams.team2)); }, [hasTeams]);
  const groupOf = (pid) => groups.findIndex(g => g.playerIds.includes(pid));
  const movePlayer = (pid, to) => setGroups(gs => gs.map((g, i) => ({ ...g, playerIds: i === to ? [...g.playerIds.filter(x => x !== pid), pid] : g.playerIds.filter(x => x !== pid) })));
  const addGroup = () => setGroups(gs => [...gs, { id: Math.max(0, ...gs.map(g => g.id)) + 1, time: '', playerIds: [] }]);
  const removeGroup = (i) => setGroups(gs => gs.filter((_, k) => k !== i));
  const setGroupTime = (i, time) => setGroups(gs => gs.map((g, k) => k === i ? { ...g, time } : g));
  const groupsProblem = !groups.length ? 'Create at least one tee time.'
    : allTeamPlayers.some(p => groupOf(p.id) < 0) ? 'Every player needs a tee time.'
    : groups.some(g => g.playerIds.length > MAX_GROUP) ? `No tee time can have more than ${MAX_GROUP} players.`
    : groups.some(g => g.playerIds.length === 0) ? 'Remove empty tee times before starting.'
    : null;

  const betEditor = (N) => {
    N = Math.max(1, N);
    const cfg = sanitizeConfig(settings.betConfiguration, N, settings.numBets);
    const setCfg = (next) => setSettings({ ...settings, numBets: next.length, betConfiguration: next.map((b, i) => ({ betNumber: i + 1, players: b.players, description: describe(b.players) })) });
    const toggle = (bi, ball) => {
      const next = cfg.map((b, i) => i !== bi ? b : { ...b, players: b.players.includes(ball) ? b.players.filter(x => x !== ball) : [...b.players, ball].sort((a, c) => a - c) });
      if (next[bi].players.length === 0) { flash('Each bet needs at least one ball'); return; }
      setCfg(next);
    };
    return (
      <div className="mt-3">
        <div className="text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">Which balls count in each bet</div>
        <div className="space-y-2">
          {cfg.map((b, bi) => (
            <div key={bi} className="bg-gray-50 rounded-xl p-2.5">
              <div className="flex items-center justify-between mb-1.5">
                <span className="font-semibold text-sm">Bet {bi + 1}</span>
                <span className="text-xs text-gray-500">{describe(b.players)}</span>
              </div>
              <div className="flex gap-1.5 flex-wrap">
                {Array.from({ length: N }, (_, k) => k).map(ball => (
                  <button key={ball} onClick={() => toggle(bi, ball)} className={`btn w-11 h-11 rounded-xl font-bold ${b.players.includes(ball) ? 'bg-fairway-600 text-white' : 'bg-white border text-gray-500'}`}>{ball + 1}</button>
                ))}
              </div>
            </div>
          ))}
        </div>
        <p className="text-xs text-gray-500 mt-1.5">1 = best score on a team for the hole, 2 = second best, and so on. Example with 5 per team: Bet 1 = balls 1 & 2, Bet 2 = balls 3 & 4. Unselected balls don't count.</p>
      </div>
    );
  };

  const groupsUI = () => {
    const byId = Object.fromEntries(allTeamPlayers.map(p => [p.id, p]));
    const isT1 = (id) => teams.team1.some(p => p.id === id);
    return (
      <div>
        <div className="flex items-center justify-between mb-2">
          <div>
            <h3 className="font-bold text-fairway-900">Tee times</h3>
            <p className="text-xs text-gray-500">Max {MAX_GROUP} per group. Scores are entered by group.</p>
          </div>
          <div className="flex gap-1.5">
            <button onClick={() => setGroups(autoGroups(teams.team1, teams.team2, groups))} className="btn text-xs font-semibold px-3 py-1.5 rounded-lg bg-gray-100">Auto-assign</button>
            <button onClick={addGroup} className="btn text-xs font-semibold px-3 py-1.5 rounded-lg bg-gray-100">➕ Add</button>
          </div>
        </div>
        <div className="space-y-3">
          {groups.map((g, gi) => (
            <div key={g.id} className="rounded-2xl border-2 border-gray-200 p-3">
              <div className="flex items-center gap-2 mb-2">
                <span className="font-bold">Group {gi + 1}</span>
                <input type="time" value={g.time} onChange={e => setGroupTime(gi, e.target.value)} className="border rounded-lg px-2 py-1 text-sm" />
                <span className={`ml-auto text-xs font-semibold px-2 py-1 rounded-full ${g.playerIds.length >= MAX_GROUP ? 'bg-amber-100 text-amber-800' : 'bg-gray-100 text-gray-600'}`}>{g.playerIds.length}/{MAX_GROUP}</span>
                {g.playerIds.length === 0 && groups.length > 1 && <button onClick={() => removeGroup(gi)} className="text-gray-400 text-sm">Remove</button>}
              </div>
              <div className="space-y-1.5">
                {g.playerIds.map(id => byId[id] && (
                  <div key={id} className="flex items-center gap-2 bg-gray-50 rounded-lg px-2.5 py-1.5">
                    <span className={`w-2.5 h-2.5 rounded-full shrink-0 ${isT1(id) ? 'bg-sky-500' : 'bg-emerald-500'}`} />
                    <span className="flex-1 font-medium truncate">{byId[id].name}</span>
                    <select value={gi} onChange={e => movePlayer(id, parseInt(e.target.value))} className="text-sm border rounded-lg px-1.5 py-1 bg-white">
                      {groups.map((gg, k) => <option key={gg.id} value={k} disabled={k !== gi && gg.playerIds.length >= MAX_GROUP}>Group {k + 1}{gg.time ? ` · ${fmtTime(gg.time)}` : ''}{k !== gi && gg.playerIds.length >= MAX_GROUP ? ' (full)' : ''}</option>)}
                    </select>
                  </div>
                ))}
                {!g.playerIds.length && <div className="text-xs text-gray-400 py-1">Empty</div>}
              </div>
            </div>
          ))}
        </div>
        <div className="flex gap-3 text-xs text-gray-500 mt-2"><span><span className="inline-block w-2 h-2 rounded-full bg-sky-500" /> Team 1</span><span><span className="inline-block w-2 h-2 rounded-full bg-emerald-500" /> Team 2</span></div>
      </div>
    );
  };

  /* ----- players ----- */

  const addPlayer = () => {
    const name = newName.trim();
    if (!name) return;
    if (players.some(p => p.name.toLowerCase() === name.toLowerCase())) { flash('That player already exists'); return; }
    const list = sortPlayers([...players, { id: Date.now(), name, tees: 'White', ghinNumber: '', handicapIndex: null, stats: emptyStats() }]);
    setPlayers(list); setNewName('');
  };
  const deletePlayer = (id) => {
    const list = players.filter(p => p.id !== id);
    setPlayers(list); setSelected(s => s.filter(x => x !== id));
    if (sb && session && canEdit) sb.from('players').delete().eq('id', id).then(() => {});
  };
  const renamePlayer = (id, name) => {
    const list = sortPlayers(players.map(p => p.id === id ? { ...p, name } : p));
    setPlayers(list);
  };
  const updateGhin = (id, ghinNumber, handicapIndex) => {
    setPlayers(players.map(p => p.id === id ? { ...p, ghinNumber, handicapIndex } : p));
  };
  const toggleSelect = (id) => setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);

  /* ----- teams ----- */
  const createTeams = () => {
    const chosen = players.filter(p => selected.includes(p.id));
    const shuffled = [...chosen];
    for (let i = shuffled.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
    const team1 = [], team2 = [];
    shuffled.forEach((p, i) => (i % 2 === 0 ? team1 : team2).push(p));
    applyTeams(team1, team2, true);
  };
  const applyTeams = (team1, team2, resetScores) => {
    const hasOddPlayers = (team1.length + team2.length) % 2 !== 0;
    const teamWithExtra = team1.length > team2.length ? 'team1' : team2.length > team1.length ? 'team2' : null;
    setTeams({ team1, team2, hasOddPlayers, teamWithExtra });
    const per = Math.max(1, Math.min(team1.length, team2.length));
    const cfg = sanitizeConfig(settings.betConfiguration, per, settings.numBets);
    setSettings(s => ({ ...s, numBets: cfg.length, betConfiguration: cfg }));
    if (resetScores) {
      const init = {};
      [...team1, ...team2].forEach(p => { init[p.id] = Array(18).fill(null); });
      setScores(init); setCurrentHole(1);
      setGroups(autoGroups(team1, team2, groups)); setActiveGroup(0);
    } else {
      setScores(prev => { const n = { ...prev }; [...team1, ...team2].forEach(p => { if (!n[p.id]) n[p.id] = Array(18).fill(null); }); return n; });
    }
  };
  const swapPlayer = (id, from) => {
    const to = from === 'team1' ? 'team2' : 'team1';
    const moving = teams[from].find(p => p.id === id);
    const next = { team1: [...teams.team1], team2: [...teams.team2] };
    next[from] = next[from].filter(p => p.id !== id);
    next[to] = [...next[to], moving];
    applyTeams(next.team1, next.team2, false);
  };

  /* ----- scoring ----- */
  const setScore = (pid, hole, val) => setScores(prev => ({ ...prev, [pid]: (prev[pid] || Array(18).fill(null)).map((s, i) => i === hole - 1 ? val : s) }));
  const parseScore = (raw) => { if (raw === '' || raw == null) return null; const n = parseInt(raw, 10); return isNaN(n) || n < 1 ? null : Math.min(n, 20); };
  const bump = (pid, hole, delta) => {
    const par = COURSE.holes[hole - 1].par;
    const cur = scores[pid]?.[hole - 1];
    if (cur == null) setScore(pid, hole, delta > 0 ? par : par - 1);
    else setScore(pid, hole, Math.max(1, Math.min(20, cur + delta)));
  };

  const sc = (pid, i) => (scores[pid] ? scores[pid][i] : null);

  // A hole counts toward the ball bets only once EVERY player on both teams has a score,
  // so results never depend on which tee time happens to finish first.
  const holeComplete = (i) => allTeamPlayers.length > 0 && allTeamPlayers.every(p => sc(p.id, i) !== null);

  const getHoleWinner = (hole) => {
    const i = hole - 1;
    if (!holeComplete(i)) return null;
    let t1 = teams.team1.map(p => sc(p.id, i)).sort((a, b) => a - b);
    let t2 = teams.team2.map(p => sc(p.id, i)).sort((a, b) => a - b);
    if (teams.hasOddPlayers) {
      if (teams.teamWithExtra === 'team1' && t1.length > t2.length) t1 = t1.slice(0, -1);
      else if (teams.teamWithExtra === 'team2' && t2.length > t1.length) t2 = t2.slice(0, -1);
    }
    if (!t1.length || !t2.length) return null;
    return settings.betConfiguration.map((bc, betIndex) => {
      const a = bc.players.filter(p => p < t1.length).map(p => t1[p]);
      const b = bc.players.filter(p => p < t2.length).map(p => t2[p]);
      if (!a.length || !b.length) return { betIndex, winner: 'tie' };
      const ta = a.reduce((x, y) => x + y, 0), tb = b.reduce((x, y) => x + y, 0);
      return { betIndex, winner: ta < tb ? 'team1' : tb < ta ? 'team2' : 'tie' };
    });
  };

  // Settle everything through a hole. Returns bets won per category and the dollars each
  // player on a team wins/loses (identical for everyone on the same team, whatever their tee time).
  const settle = (throughHole = 18) => {
    const amt = settings.betAmount;
    const ball = settings.betConfiguration.map(b => ({ key: 'ball', label: `Bet ${b.betNumber}: ${b.description}`, t1: 0, t2: 0 }));
    const bonus = { key: 'birdie', label: 'Birdie bonus', t1: 0, t2: 0 };
    const par = { key: 'par', label: 'Par or better', t1: 0, t2: 0 };
    const allb = { key: 'allballs', label: 'All balls', t1: 0, t2: 0 };
    const side = { team1: 't1', team2: 't2' };
    for (let hole = 1; hole <= throughHole; hole++) {
      const i = hole - 1, hp = COURSE.holes[i].par;
      (getHoleWinner(hole) || []).forEach(x => { if (x.winner === 'team1') ball[x.betIndex].t1++; else if (x.winner === 'team2') ball[x.betIndex].t2++; });
      ['team1', 'team2'].forEach(t => {
        if (settings.birdieBonus) teams[t].forEach(p => { const s = sc(p.id, i); if (s !== null) { const u = hp - s; if (u >= 1) bonus[side[t]] += Math.min(u, 3); } });
        if (settings.parOrBetterBonus) {
          const hs = teams[t].map(p => sc(p.id, i)).filter(s => s !== null);
          if (hs.length === teams[t].length && hs.length > 0 && hs.reduce((a, b) => a + b, 0) <= hp * teams[t].length) par[side[t]] += teams[t].length;
        }
      });
    }
    if (settings.allBalls) {
      [settings.allBallsFront, settings.allBallsBack].forEach(h => {
        if (!h || throughHole < h) return;
        const a = teams.team1.map(p => sc(p.id, h - 1)).filter(s => s !== null);
        const b = teams.team2.map(p => sc(p.id, h - 1)).filter(s => s !== null);
        if (a.length === teams.team1.length && b.length === teams.team2.length) {
          const ta = a.reduce((x, y) => x + y, 0), tb = b.reduce((x, y) => x + y, 0);
          if (ta < tb) allb.t1++; else if (tb < ta) allb.t2++;
        }
      });
    }
    const rows = [...ball, ...(settings.birdieBonus ? [bonus] : []), ...(settings.parOrBetterBonus ? [par] : []), ...(settings.allBalls ? [allb] : [])]
      .map(r => ({ ...r, net: r.t1 - r.t2 }));
    const t1Bets = rows.reduce((a, r) => a + r.t1, 0), t2Bets = rows.reduce((a, r) => a + r.t2, 0);
    const totalNet = t1Bets - t2Bets;
    const n1 = teams.team1.length, n2 = teams.team2.length;
    // The losing side pays `amt` per net bet each; the winning side splits the pot evenly among its players.
    const f1 = totalNet > 0 && n1 ? amt * n2 / n1 : amt;
    const f2 = totalNet < 0 && n2 ? amt * n1 / n2 : amt;
    const r2 = (v) => Math.round(v * 100) / 100;
    rows.forEach(r => { r.team1Amt = r2(r.net * f1); r.team2Amt = r2(-r.net * f2); });
    const team1Amt = r2(totalNet * f1), team2Amt = r2(-totalNet * f2);
    const moneyMap = {};
    teams.team1.forEach(p => { moneyMap[p.id] = team1Amt; });
    teams.team2.forEach(p => { moneyMap[p.id] = team2Amt; });
    return { rows, t1Bets, t2Bets, totalNet, team1Amt, team2Amt, betAmount: amt, money: moneyMap };
  };
  const tally = (h) => { const r = settle(h); return { team1: r.t1Bets, team2: r.t2Bets }; };
  const calcMoney = (h = 18) => settle(h).money;

  const finalizeGame = () => {
    const all = [...teams.team1, ...teams.team2];
    const incomplete = all.filter(p => (scores[p.id] || []).some(s => s === null));
    if (incomplete.length && !confirm(`${incomplete.length} player(s) have missing scores. Finalize anyway?`)) return;
    const moneyResults = calcMoney(18);
    const record = { date: new Date().toISOString(), teams, scores, moneyResults, settings, groups, breakdown: settle(18) };
    const updated = players.map(p => {
      const ps = scores[p.id];
      if (!ps) return p;
      const played = ps.filter(s => s !== null);
      const total = played.reduce((a, b) => a + b, 0);
      if (played.length < 18) { // partial round: money only, no score stats
        return { ...p, stats: { ...p.stats, moneyWon: p.stats.moneyWon + (moneyResults[p.id] || 0) } };
      }
      const rounds = p.stats.rounds + 1;
      return { ...p, stats: {
        rounds,
        avgScore: (p.stats.avgScore * p.stats.rounds + total) / rounds,
        highScore: p.stats.highScore === null ? total : Math.max(p.stats.highScore, total),
        lowScore: p.stats.lowScore === null ? total : Math.min(p.stats.lowScore, total),
        moneyWon: p.stats.moneyWon + (moneyResults[p.id] || 0)
      } };
    });
    setGames([record, ...games]); setPlayers(updated);
    saveToSupabase(record, updated);
    // reset in-progress game
    setTeams({ team1: [], team2: [], hasOddPlayers: false, teamWithExtra: null });
    setScores({}); setCurrentHole(1); setSelected([]); setGroups([]); setActiveGroup(0);
    flash('Round saved — stats updated');
    setView('stats');
  };

  /* ----- scorecard scanning (AI vision; key stays on this device) ----- */
  const fileToDataUrl = (file) => new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const maxDim = 1800;
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      } catch (e) { reject(e); }
    };
    img.onerror = reject;
    img.src = url;
  });

  const handleScanFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (!session) { flash('Sign in to use scorecard scanning'); return; }
    const targets = scanTargetsRef.current.length ? scanTargetsRef.current : players.map(p => ({ id: p.id, name: p.name }));
    setScanBusy(true); flash('Reading scorecard...');
    try {
      const dataUrl = await fileToDataUrl(file);
      const { data: parsed, error: fnErr } = await sb.functions.invoke('scan-scorecard', { body: { imageDataUrl: dataUrl, targets: targets.map(t => ({ id: t.id, name: t.name })), pars: COURSE.holes.map(h => h.par) } });
      if (fnErr) throw new Error('Scan failed - are you signed in?');
      if (!parsed) throw new Error('The scan service returned nothing');
      if (parsed.error) throw new Error(parsed.error);
      const rawRows = parsed.rows || [];
      const usedPids = new Set(rawRows.map(r => r.playerId).filter(id => id != null && targets.some(t => t.id === id)));
      const rows = rawRows.map(r => {
        let pid = (r.playerId != null && targets.some(t => t.id === r.playerId)) ? r.playerId : '';
        if (!pid && r.name) { const rn = String(r.name).toLowerCase(); const free = targets.filter(t => !usedPids.has(t.id)); const m = free.find(t => t.name.toLowerCase() === rn) || free.find(t => t.name.toLowerCase().startsWith(rn) || rn.startsWith(t.name.toLowerCase().split(' ')[0])); if (m) { pid = m.id; usedPids.add(m.id); } }
        return { playerId: pid, name: r.name || '', scores: Array.from({ length: 18 }, (_, i) => { const v = (r.scores || [])[i]; return (typeof v === 'number' && v >= 1 && v <= 20) ? v : null; }), unsure: r.unsure || [], out: (r.out === undefined ? null : r.out), in: (r.in === undefined ? null : r.in), tot: (r.tot === undefined ? null : r.tot) };
      });
      if (!rows.length) throw new Error('No player rows could be read from that photo');
      setScanReview({ rows });
    } catch (err) { flash('Scan failed: ' + err.message); }
    setScanBusy(false);
  };

  const applyScan = () => {
    if (!scanReview) return;
    const ids = scanReview.rows.map(r => r.playerId).filter(Boolean);
    if (ids.some((v, i) => ids.indexOf(v) !== i)) { flash('Two rows are assigned to the same player - fix before applying'); return; }
    setScores(prev => {
      const next = { ...prev };
      scanReview.rows.forEach(r => {
        if (!r.playerId) return;
        const cur = (next[r.playerId] || Array(18).fill(null)).slice();
        r.scores.forEach((v, i) => { if (v != null) cur[i] = v; });
        next[r.playerId] = cur;

      return next;
    });

  };

  const scanRowCheck = (r) => {
    const front = r.scores.slice(0, 9).reduce((a, v) => a + (v || 0), 0);
    const back = r.scores.slice(9).reduce((a, v) => a + (v || 0), 0);

    if (missing) return missing + ' hole' + (missing > 1 ? 's' : '') + ' unread';
    if (r.out != null && r.out !== front) return 'Front adds to ' + front + ', card says ' + r.out;

  /* ----- supabase save (finalized round) ----- */

  const resetSeason = () => {

    setPlayers(players.map(p => ({ ...p, stats: emptyStats() }))); setGames([]); flash('Season reset');
    if (sb && session && canEdit) sb.from('games').delete().neq('id', '00000000-0000-0000-0000-000000000000').then(() => {});
  };

  /* ---------- views ---------- */
  const filtered = players.filter(p => p.name.toLowerCase().includes(search.toLowerCase()));

  const Setup = () => (

          {!filtered.length && <div className="text-gray-400 text-sm p-4">No players match.</div>}

          <button onClick={addPlayer} className="btn bg-fairway-600 text-white font-semibold rounded-xl px-4">➕ Add</button>

      {selected.length >= 4 ? (

    const ScanButton = (

    const ModeSwitch = <div className="space-y-3">{ModeToggle}{GroupTabs}</div>;

    const StatusCard = (
      <div className="card p-4">

        <div className="grid grid-cols-3 gap-2 text-center">
          <div className="rounded-xl bg-sky-50 p-2.5"><div className="text-xs text-sky-700">Team 1</div><div className="text-2xl font-extrabold text-sky-700">{status.team1}</div></div>
          <div className="rounded-xl bg-gray-50 p-2.5"><div className="text-xs text-gray-500">Net</div><div className="text-lg font-extrabold">{net > 0 ? `T1 +${net}` : net < 0 ? `T2 +${-net}` : 'Even'}</div></div>
          <div className="rounded-xl bg-emerald-50 p-2.5"><div className="text-xs text-emerald-700">Team 2</div><div className="text-2xl font-extrabold text-emerald-700">{status.team2}</div></div>
        </div>
        <div className="text-center text-xs text-gray-500 mt-2">{net === 0 ? 'All square' : `${net > 0 ? 'Team 1' : 'Team 2'} leads by ${Math.abs(net)} bet${Math.abs(net) > 1 ? 's' : ''} (${money(Math.abs(net) * settings.betAmount)} each)`}</div>
      </div>
    );

    const BreakdownCard = (
      <div className="card p-4">
        <div className="text-xs font-semibold uppercase tracking-wide text-gray-500 mb-2">Betting breakdown (all completed holes)</div>
        <BreakdownTable data={settle(18)} />
      </div>
    );

    if (entryMode === 'grid') {
      return (
        <div className="space-y-4">
          {ModeSwitch}
          {ScanButton}
          <div className="card p-3 overflow-x-auto">
            <table className="text-sm border-collapse min-w-full">
              <thead>
                <tr className="text-xs text-gray-500">
                  <th className="sticky left-0 bg-white p-2 text-left z-10">Player</th>
                  {COURSE.holes.map(x => <th key={x.hole} className="p-1 min-w-[2.6rem]"><div>{x.hole}</div><div className="font-normal text-gray-400">P{x.par}</div></th>)}
                  <th className="p-2">Tot</th><th className="p-2">$</th>
                </tr>
              </thead>
              <tbody>
                {[['team1', 'bg-sky-50'], ['team2', 'bg-emerald-50']].map(([t, bg]) => teams[t].filter(inGroup).map(p => {
                  const ps = scores[p.id] || Array(18).fill(null);
                  const total = ps.reduce((a, s) => a + (s || 0), 0);
                  const m = moneyNow[p.id] || 0;
                  return (
                    <tr key={p.id} className="border-t">
                      <td className={`sticky left-0 ${bg} p-2 font-semibold whitespace-nowrap z-10`}>{p.name}</td>
                      {COURSE.holes.map((x, i) => (
                        <td key={i} className="p-0.5">
                          <input type="number" inputMode="numeric" value={ps[i] ?? ''} onChange={e => setScore(p.id, x.hole, parseScore(e.target.value))} className={`w-10 text-center py-1.5 border rounded-lg ${scoreClass(ps[i], x.par)} font-semibold`} />
                        </td>
                      ))}
                      <td className="p-2 font-bold text-center">{total || '–'}</td>
                      <td className={`p-2 font-bold text-center ${m >= 0 ? 'text-fairway-700' : 'text-red-600'}`}>{money(m)}</td>
                    </tr>
                  );
                }))}
              </tbody>
            </table>
          </div>
          {StatusCard}{BreakdownCard}
          <button onClick={finalizeGame} className="btn w-full bg-fairway-700 text-white font-bold rounded-xl py-3.5">💾 Finalize round</button>
        </div>
      );
    }

    const PlayerScore = ({ p, accent }) => {
      const s = sc(p.id, currentHole - 1);
      return (
        <div className="flex items-center gap-2 bg-white rounded-xl p-2 border">
          <div className="flex-1 min-w-0">
            <div className="font-semibold truncate">{p.name}</div>
            <div className={`text-xs ${s == null ? 'text-gray-400' : 'text-gray-500'}`}>{s == null ? 'tap + for par' : scoreLabel(s, h.par)}</div>
          </div>
          <button onClick={() => bump(p.id, currentHole, -1)} className="btn w-11 h-11 rounded-xl bg-gray-100 text-xl font-bold">−</button>
          <div className={`w-10 text-center text-2xl font-extrabold ${scoreClass(s, h.par)}`}>{s ?? '–'}</div>
          <button onClick={() => bump(p.id, currentHole, 1)} className={`btn w-11 h-11 rounded-xl text-xl font-bold text-white ${accent}`}>+</button>
        </div>
      );
    };

    const winText = holeWin && holeWin.map(r => r.winner === 'team1' ? 'T1' : r.winner === 'team2' ? 'T2' : 'Tie').join(' · ');

    return (
      <div className="space-y-4">
        {ModeSwitch}
        {ScanButton}
        <div className="flex gap-1.5 overflow-x-auto no-scrollbar py-1">
          {COURSE.holes.map(x => {
            const done = groupPlayers.every(p => sc(p.id, x.hole - 1) !== null);
            return <button key={x.hole} onClick={() => setCurrentHole(x.hole)} className={`btn shrink-0 w-9 h-9 rounded-full text-sm font-bold ${currentHole === x.hole ? 'bg-fairway-700 text-white' : done ? 'bg-fairway-200 text-fairway-900' : 'bg-white text-gray-500 border'}`}>{x.hole}</button>;
          })}
        </div>

        <div className="card overflow-hidden">
          <div className="hero text-white p-4 flex items-center justify-between">
            <div>
              <div className="text-sm opacity-80">Riverbend CC</div>
              <div className="text-3xl font-extrabold">Hole {currentHole}</div>
            </div>
            <div className="text-right text-sm">
              <div className="font-bold text-lg">Par {h.par}</div>
              <div className="opacity-80">{h.white} yds · HCP {h.handicap}</div>
            </div>
          </div>
          <div className="p-3 grid sm:grid-cols-2 gap-3">
            <div className="space-y-2"><div className="text-sm font-bold text-sky-700">Team 1</div>{teams.team1.filter(inGroup).map(p => <PlayerScore key={p.id} p={p} accent="bg-sky-600" />)}{!teams.team1.some(inGroup) && <div className="text-xs text-gray-400">None in this group</div>}</div>
            <div className="space-y-2"><div className="text-sm font-bold text-emerald-700">Team 2</div>{teams.team2.filter(inGroup).map(p => <PlayerScore key={p.id} p={p} accent="bg-emerald-600" />)}{!teams.team2.some(inGroup) && <div className="text-xs text-gray-400">None in this group</div>}</div>
          </div>
          {winText && <div className="mx-3 mb-3 text-center text-sm bg-gray-50 rounded-lg py-2">Hole result: <b>{winText}</b></div>}
          <div className="grid grid-cols-2 gap-3 p-3 pt-0">
            <button disabled={currentHole === 1} onClick={() => setCurrentHole(currentHole - 1)} className="btn bg-gray-100 disabled:opacity-40 rounded-xl py-3 font-semibold">← Previous</button>
            <button disabled={currentHole === 18} onClick={() => setCurrentHole(currentHole + 1)} className="btn bg-fairway-700 disabled:opacity-40 text-white rounded-xl py-3 font-semibold">Next →</button>
          </div>
        </div>

        {StatusCard}{BreakdownCard}

        {currentHole === 18 && <button onClick={finalizeGame} className="btn w-full bg-amber-500 text-white font-bold rounded-xl py-3.5 text-lg">🏆 Finalize round</button>}
      </div>
    );
  };

  const Stats = () => {
    const active = players.filter(p => p.stats.rounds > 0 || p.stats.moneyWon !== 0).sort((a, b) => b.stats.moneyWon - a.stats.moneyWon);
    return (
      <div className="space-y-4">
        <div className="card p-4">
          <h2 className="text-lg font-bold text-fairway-900 mb-3">🏆 Season leaderboard</h2>
          {!active.length ? <div className="text-gray-400 text-sm py-6 text-center">No rounds finalized yet.</div> : (
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead className="text-xs text-gray-500 uppercase"><tr><th className="p-2 text-left">#</th><th className="p-2 text-left">Player</th><th className="p-2">Rds</th><th className="p-2">Avg</th><th className="p-2">Index</th><th className="p-2">vs Hcp</th><th className="p-2">Low</th><th className="p-2">High</th><th className="p-2 text-right">Money</th></tr></thead>
                <tbody className="divide-y">
                  {active.map((p, i) => (
                    <tr key={p.id}>
                      <td className="p-2 text-gray-400">{i + 1}</td>
                      <td className="p-2 font-semibold">{p.name}{p.ghinNumber ? <div className="text-xs text-gray-400 font-normal">GHIN {p.ghinNumber}</div> : null}</td>
                      <td className="p-2 text-center">{p.stats.rounds}</td>
                      <td className="p-2 text-center">{p.stats.rounds ? p.stats.avgScore.toFixed(1) : '–'}</td>
                      <td className="p-2 text-center">{p.handicapIndex != null ? Number(p.handicapIndex).toFixed(1) : '–'}</td>
                      <td className="p-2 text-center">{(p.stats.rounds && p.handicapIndex != null) ? (() => { const v = p.stats.avgScore - (72 + Number(p.handicapIndex)); return (v > 0 ? '+' : '') + v.toFixed(1); })() : '–'}</td>
                      <td className="p-2 text-center">{p.stats.lowScore ?? '–'}</td>
                      <td className="p-2 text-center">{p.stats.highScore ?? '–'}</td>
                      <td className={`p-2 text-right font-bold ${p.stats.moneyWon >= 0 ? 'text-fairway-700' : 'text-red-600'}`}>{money(p.stats.moneyWon)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <p className="text-xs text-gray-400 mt-2">Index = GHIN Handicap Index on file (edit it from the Setup roster). vs Hcp = season scoring average minus (par 72 + index) — negative means scoring better than their handicap. No slope/rating adjustment.</p>
            </div>
          )}
        </div>
        <div className="card p-4">
          <h2 className="text-lg font-bold text-fairway-900 mb-3">Round history</h2>
          {!games.length ? <div className="text-gray-400 text-sm py-4 text-center">Nothing yet.</div> : (
            <div className="space-y-2">
              {games.map((g, i) => {
                const names = (arr) => arr.map(p => p.name).join(', ');
                const winners = g.teams.team1.concat(g.teams.team2).filter(p => (g.moneyResults[p.id] || 0) > 0);
                return (
                  <div key={g.date + i} className="bg-gray-50 rounded-xl p-3 text-sm">
                    <div className="flex justify-between items-start">
                      <div className="font-semibold">{new Date(g.date).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })}</div>
                      <button onClick={() => { if (confirm('Delete this round from history? (Player stats are not changed.)')) setGames(games.filter((_, j) => j !== i)); }} className="text-gray-400 text-xs">Delete</button>
                    </div>
                    <div className="text-sky-700">T1: {names(g.teams.team1)}</div>
                    <div className="text-emerald-700">T2: {names(g.teams.team2)}</div>
                    <div className="text-gray-600 mt-1">{winners.length ? `Winners: ${names(winners)} (${money(g.moneyResults[winners[0].id])} each)` : 'Push — no money changed hands'}</div>
                    {g.breakdown && <details open={i === 0} className="mt-2"><summary className="cursor-pointer text-fairway-700 font-semibold">Betting breakdown</summary><div className="mt-2"><BreakdownTable data={g.breakdown} /></div></details>}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    );
  };

  const tabs = [['setup', '⛳', 'Setup', true], ['teams', '👥', 'Teams', hasTeams], ['game', '📝', 'Game', hasTeams], ['stats', '🏆', 'Stats', true]];

  if (sb && !authReady) return (<div className="min-h-screen flex items-center justify-center text-gray-500">Loading...</div>);
  if (sb && !session && !offline) return (
    <div className="min-h-screen flex items-center justify-center p-4">
      <div className="card w-full max-w-sm p-6">
        <div className="text-xs uppercase tracking-widest text-fairway-700 font-semibold">Riverbend Country Club</div>
        <h1 className="text-2xl font-extrabold text-fairway-900 mt-1 mb-1">B Group Golf Tracker</h1>
        <p className="text-sm text-gray-500 mb-4">Sign in so scores and stats sync for everyone. Accounts are invite-only - ask Jon for an invite.</p>
        <input value={loginEmail} onChange={e => setLoginEmail(e.target.value)} placeholder="Email" type="email" className="w-full border rounded-xl px-3 py-2.5 text-sm mb-2" />
        <input value={loginPass} onChange={e => setLoginPass(e.target.value)} placeholder="Password" type="password" className="w-full border rounded-xl px-3 py-2.5 text-sm mb-3" onKeyDown={e => e.key === 'Enter' && signIn()} />
        <button onClick={signIn} className="btn w-full bg-fairway-700 text-white rounded-xl py-3 font-bold">Sign in</button>
        <button onClick={signInWithLink} className="btn w-full bg-gray-100 rounded-xl py-2.5 text-sm font-semibold mt-2">Email me a sign-in link instead</button>
        <button onClick={() => setOffline(true)} className="btn w-full text-gray-400 text-xs mt-4">Continue without an account - this device only</button>
        {toast && <div className="text-center text-sm text-gray-600 mt-3">{toast}</div>}
      </div>
    </div>
  );

  return (
    <div className="min-h-screen pb">
      <header className="hero text-white">
        <div className="max-w-3xl mx-auto px-4 pt-6 pb-8 flex items-start justify-between">
          <div className="flex items-center gap-4 min-w-0">
            <div className="shrink-0 bg-white rounded-2xl p-1.5 shadow-lg">
              <img src={LOGO_SRC} alt="Riverbend Country Club" className="w-16 h-16 sm:w-20 sm:h-20 object-contain" />
            </div>
            <div className="min-w-0">
              <div className="text-xs uppercase tracking-widest text-fairway-200 font-semibold">Riverbend Country Club</div>
              <h1 className="text-2xl sm:text-3xl font-extrabold leading-tight mt-1">B Group Golf Tracker</h1>
              <p className="text-fairway-100 text-sm mt-1">Scores, teams & winnings</p>
            </div>
          </div>
          <button onClick={() => setShowSettings(true)} className="btn w-11 h-11 rounded-full bg-white/15 text-xl">⚙️</button>
        </div>
      </header>

      <main className="max-w-3xl mx-auto px-4 -mt-4">
        {view === 'setup' && Setup()}
        {view === 'teams' && hasTeams && Teams()}
        {view === 'game' && Game()}
        {view === 'stats' && Stats()}
      </main>

      <nav className="nav fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur border-t z-40">
        <div className="max-w-3xl mx-auto grid grid-cols-4">
          {tabs.map(([k, ic, label, enabled]) => (
            <button key={k} disabled={!enabled} onClick={() => setView(k)} className={`py-2.5 flex flex-col items-center text-xs font-semibold disabled:opacity-30 ${view === k ? 'text-fairway-700' : 'text-gray-500'}`}>
              <span className={`text-xl ${view === k ? '' : 'grayscale opacity-70'}`}>{ic}</span>{label}
              {view === k && <span className="block w-6 h-0.5 bg-fairway-600 rounded mt-0.5" />}
            </button>
          ))}
        </div>
      </nav>

      {toast && <div className="fixed left-1/2 -translate-x-1/2 bottom-24 z-50 bg-gray-900 text-white text-sm px-4 py-2.5 rounded-full shadow-lg pop max-w-[90vw]">{toast}</div>}

      <input ref={scanFileRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={handleScanFile} />
      {scanBusy && <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50"><div className="card p-6 text-center font-semibold text-gray-700">\📷 Reading scorecard...</div></div>}
      {scanReview && (
        <Modal title="Review scanned scores" onClose={() => setScanReview(null)}>
          <p className="text-sm text-gray-500 mb-3">Check the amber cells against the card, fix anything wrong, then apply. Blank means not read.</p>
          <div className="space-y-4 max-h-[55vh] overflow-y-auto pr-1">
            {scanReview.rows.map((r, ri) => (
              <div key={ri} className="border rounded-xl p-2.5">
                <div className="flex items-center gap-2 mb-2">
                  <select value={r.playerId} onChange={e => { const v = e.target.value === '' ? '' : Number(e.target.value); setScanReview(sr => ({ rows: sr.rows.map((x, xi) => xi === ri ? { ...x, playerId: v } : x) })); }} className="border rounded-lg px-2 py-1.5 text-sm font-semibold flex-1 min-w-0">
                    <option value="">- assign player -</option>
                    {players.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>
                  <span className="text-xs text-gray-400 shrink-0">card: {r.name || '?'}</span>
                </div>
                <div className="grid grid-cols-9 gap-1">
                  {r.scores.map((v, i) => (
                    <div key={i} className="text-center">
                      <div className="text-[10px] text-gray-400">{i + 1}</div>
                      <input type="number" inputMode="numeric" value={v ?? ''} onChange={e => { const nv = parseScore(e.target.value); setScanReview(sr => ({ rows: sr.rows.map((x, xi) => xi === ri ? { ...x, scores: x.scores.map((s, si) => si === i ? nv : s) } : x) })); }} className={'w-full text-center py-1 rounded-md border text-sm ' + (r.unsure.includes(i + 1) ? 'bg-amber-100 border-amber-300' : '')} />
                    </div>
                  ))}
                </div>
                <div className={'text-xs mt-1.5 ' + (scanRowCheck(r).startsWith('\u2713') ? 'text-fairway-700' : 'text-amber-700 font-semibold')}>{scanRowCheck(r)}</div>
              </div>
            ))}
          </div>
          {(() => { const ids = scanReview.rows.map(r => r.playerId).filter(Boolean); return ids.some((v, i) => ids.indexOf(v) !== i) ? <div className="text-sm text-red-600 font-semibold mt-3">Two rows are assigned to the same player - fix the assignments before applying.</div> : null; })()}
          <button onClick={applyScan} className="btn w-full mt-4 bg-fairway-700 text-white rounded-xl py-3 font-bold">Apply scores</button>
          <button onClick={() => setScanReview(null)} className="btn w-full mt-2 bg-gray-100 rounded-xl py-2.5 text-sm font-semibold">Cancel</button>
        </Modal>
      )}

      {showSettings && (
        <Modal title="Settings" onClose={() => setShowSettings(false)}>
          <h3 className="font-bold text-gray-800 mb-1">Account & cloud sync</h3>
          {session ? (
            <div className="mb-5">
              <div className="text-sm text-gray-700">Signed in as <b>{session.user.email}</b></div>
              <div className="text-xs text-gray-500 mb-2">Role: {myRole || 'viewer'} - scores and stats sync live for signed-in players.</div>
              <button onClick={signOut} className="btn bg-gray-100 rounded-xl px-4 py-2 text-sm font-semibold">Sign out</button>
              <div className="flex gap-2 mt-3">
                <input value={newPass} onChange={e => setNewPass(e.target.value)} placeholder="Set / update password" type="password" className="flex-1 min-w-0 border rounded-xl px-3 py-2 text-sm" />
                <button onClick={updatePassword} className="btn bg-gray-100 rounded-xl px-4 py-2 text-sm font-semibold">Save</button>
              </div>
            </div>
          ) : (
            <div className="mb-5">
              <div className="text-sm text-gray-600 mb-2">Not signed in - data is only on this device.</div>
              <button onClick={() => { setOffline(false); setShowSettings(false); }} className="btn bg-gray-100 rounded-xl px-4 py-2 text-sm font-semibold">Go to sign in</button>
            </div>
          )}

          <h3 className="font-bold text-gray-800 mt-5 mb-1">Scorecard scanning (AI)</h3>
          <p className="text-xs text-gray-500 mb-3">Built in for every signed-in player: in the Game view, tap the scan button, photograph the group's scorecard, review the read, and apply. The photo is read by the club's server, so no key or setup is needed on your phone.</p>

          <h3 className="font-bold text-gray-800 mt-5 mb-2">Backup</h3>
          <div className="grid grid-cols-2 gap-2">
            <button onClick={exportBackup} className="btn bg-gray-100 rounded-xl py-2.5 text-sm font-semibold">⬇️ Export</button>
            <label className="btn bg-gray-100 rounded-xl py-2.5 text-sm font-semibold text-center cursor-pointer">⬆️ Import<input type="file" accept="application/json" className="hidden" onChange={e => e.target.files[0] && importBackup(e.target.files[0])} /></label>
          </div>
          <p className="text-xs text-gray-500 mt-2">When you are signed in, your data lives in the cloud and syncs across devices. Export a backup now and then as an extra copy.</p>

          <button onClick={resetSeason} className="btn w-full mt-5 bg-red-50 text-red-700 rounded-xl py-2.5 text-sm font-semibold">Reset season stats</button>
          <button onClick={() => setShowSettings(false)} className="btn w-full mt-3 bg-fairway-700 text-white rounded-xl py-3 font-bold">Done</button>
        </Modal>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
